<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#123c32">
  <title>Budget BancoPosta</title>
  <style>
    :root{font-family:system-ui,-apple-system,sans-serif;color:#17382f;background:#f2f6f3}*{box-sizing:border-box}body{margin:0}main{max-width:650px;margin:auto;padding:20px 16px 60px}.card{background:#fff;border-radius:20px;padding:19px;margin:14px 0;box-shadow:0 4px 20px #183e3010}.hero{background:#123c32;color:#fff}.hero small{color:#c3ded1}.amount{font-size:37px;font-weight:800;margin:10px 0}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:12px}.metric{font-size:23px;font-weight:750;margin:6px 0}label{display:block;font-size:13px;font-weight:650;margin:13px 0 5px}input,button{width:100%;padding:13px;border-radius:12px;font:inherit}input{border:1px solid #b9cec3}button{border:0;background:#17684b;color:#fff;font-weight:700;margin-top:13px;cursor:pointer}.secondary{background:#e4efe9;color:#174b37}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.row button{width:auto;margin:0}.hidden{display:none}.muted,small{color:#678075}#status{min-height:22px}.movement{padding:14px 0;border-bottom:1px solid #e2ece7}.movement:last-child{border-bottom:0}.movement-title{font-weight:750}.movement-date{font-size:13px;color:#678075;margin-top:3px}.movement-amount{font-weight:800;white-space:nowrap}.movement-amount.positive{color:#16834f}.movement-amount.negative{color:#b63d3d}
  </style>
</head>
<body><main>
  <header class="row"><div><small>IL MIO DENARO</small><h1>Budget personale</h1></div><button id="logout" class="secondary hidden">Esci</button></header>
  <section id="login" class="card"><h2>Accesso privato</h2><p>Saldo e impostazioni sono visibili soltanto dopo l’accesso.</p><button id="loginGoogle">Continua con Google</button></section>
  <div id="app" class="hidden">
    <section class="card hero"><small>Saldo disponibile</small><div class="amount" id="balanceView">—</div><div class="twocol"><div><small>Puoi spendere oggi</small><div class="metric" id="todayView">—</div></div><div><small>Budget di domani</small><div class="metric" id="tomorrowView">—</div></div></div><small id="daysView"></small></section>
    <section class="card"><div class="row"><h2>Movimenti recenti</h2><small id="movementCount"></small></div><div id="movements"><p class="muted">Nessun movimento importato.</p></div></section>
    <section class="card"><h2>Impostazioni</h2><label for="balance">Saldo (€)</label><input id="balance" type="number" min="0" step="0.01"><label for="balanceDate">Data saldo</label><input id="balanceDate" type="date"><label for="reserve">Riserva (€)</label><input id="reserve" type="number" min="0" step="0.01"><label for="planned">Spese previste (€)</label><input id="planned" type="number" min="0" step="0.01"><label for="payday">Prossimo stipendio</label><input id="payday" type="date"><button id="save">Salva</button><p id="status" role="status"></p></section>
  </div>
</main>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js';
import {getAuth,GoogleAuthProvider,signInWithPopup,signOut,onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js';
import {getFirestore,doc,getDoc,setDoc,serverTimestamp,collection,getDocs,query,orderBy,limit} from 'https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js';
const firebaseConfig={apiKey:'AIzaSyDO5L412boYXH4FkXYLY8r-W0KIWL-R8xo',authDomain:'budget-bancoposta.firebaseapp.com',projectId:'budget-bancoposta',storageBucket:'budget-bancoposta.firebasestorage.app',messagingSenderId:'511666390425',appId:'1:511666390425:web:23e4de16f5836e9dff3f08'};
const firebaseApp=initializeApp(firebaseConfig),auth=getAuth(firebaseApp),db=getFirestore(firebaseApp),$=id=>document.getElementById(id),euro=n=>new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR'}).format(n||0);
let user=null,data={balance:0,balanceDate:'',reserve:0,planned:0,payday:''};
const today=()=>new Date().toISOString().slice(0,10);const days=(a,b)=>Math.max(0,Math.round((Date.parse(b+'T12:00:00Z')-Date.parse(a+'T12:00:00Z'))/86400000));
function render(){const d=days(today(),data.payday),usable=Math.max(0,data.balance-data.reserve-data.planned);$('balanceView').textContent=euro(data.balance);$('todayView').textContent=d?euro(usable/d):'—';$('tomorrowView').textContent=d>1?euro(usable/(d-1)):'—';$('daysView').textContent=d?`${d} giorni · ${euro(data.reserve)} di riserva`:'Imposta la data del prossimo stipendio';for(const k of ['balance','balanceDate','reserve','planned','payday'])$(k).value=data[k]??''}
function renderMovements(items){$('movementCount').textContent=items.length?`${items.length} movimenti`:'';$('movements').replaceChildren();if(!items.length){$('movements').innerHTML='<p class="muted">Nessun movimento importato.</p>';return}for(const item of items){const row=document.createElement('div');row.className='movement row';const info=document.createElement('div'),title=document.createElement('div'),date=document.createElement('div'),amount=document.createElement('div');title.className='movement-title';title.textContent=item.description||item.type||'Movimento';date.className='movement-date';date.textContent=[item.type,item.accountingDate].filter(Boolean).join(' · ');amount.className=`movement-amount ${Number(item.amount)>=0?'positive':'negative'}`;amount.textContent=euro(item.amount);info.append(title,date);row.append(info,amount);$('movements').append(row)}}
async function loadMovements(){const snap=await getDocs(query(collection(db,'users',user.uid,'movements'),orderBy('sortDate','desc'),limit(50)));renderMovements(snap.docs.map(d=>d.data()))}
$('loginGoogle').onclick=()=>signInWithPopup(auth,new GoogleAuthProvider()).catch(e=>$('status').textContent=e.message);
$('logout').onclick=()=>signOut(auth);
$('save').onclick=async()=>{if(!user)return;data={balance:Number($('balance').value)||0,balanceDate:$('balanceDate').value||today(),reserve:Number($('reserve').value)||0,planned:Number($('planned').value)||0,payday:$('payday').value,updatedAt:serverTimestamp()};await setDoc(doc(db,'users',user.uid,'budget','current'),data,{merge:true});$('status').textContent='Dati salvati in modo privato.';render()};
onAuthStateChanged(auth,async current=>{user=current;$('login').classList.toggle('hidden',!!user);$('app').classList.toggle('hidden',!user);$('logout').classList.toggle('hidden',!user);if(!user)return;const snap=await getDoc(doc(db,'users',user.uid,'budget','current'));if(snap.exists())data={...data,...snap.data()};render();await loadMovements().catch(()=>renderMovements([]))});
</script></body></html>
